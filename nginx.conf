# ============================================================
# Career Copilot AI — Nginx Production Configuration
# ============================================================
# Copy this to your Nginx sites-available directory and adjust
# paths and domain names for your server.
#
# Usage:
#   sudo cp nginx.conf /etc/nginx/sites-available/career-copilot
#   sudo ln -s /etc/nginx/sites-available/career-copilot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── SSL (managed by Certbot / Let's Encrypt) ──────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                    always;
    add_header X-Frame-Options         "SAMEORIGIN"                 always;
    add_header X-XSS-Protection        "1; mode=block"              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Frontend static files ─────────────────────────────────
    root /var/www/career-copilot/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Cache hashed assets permanently
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — serve index.html for all routes ────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ─────────────────────────────────────
    # Adjust the upstream port if your backend runs on a different port.
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Upload size limit
        client_max_body_size 10M;
    }
}
